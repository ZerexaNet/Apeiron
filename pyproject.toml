[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apeiron"
version = "0.1.0"
description = "Apeiron — an independent third-party Minecraft launcher for Windows, macOS and Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Zerexa Ltd", email = "admin@zerexa.net" }]
keywords = ["minecraft", "launcher", "pyside6", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Games/Entertainment",
]
dependencies = ["PySide6-Essentials>=6.7,<6.10"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
build = ["nuitka>=2.4", "zstandard>=0.23", "ordered-set>=4.1"]

[project.scripts]
apeiron = "apeiron.__main__:main"

[project.urls]
Homepage = "https://github.com/ZerexaNet/Apeiron"
Issues = "https://github.com/ZerexaNet/Apeiron/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apeiron = ["qml/**/*.qml", "qml/**/qmldir", "i18n/*.qm", "i18n/*.ts", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
    "network: test requires outbound network access",
    "gui: test requires a Qt platform plugin",
    "slow: long running test",
]
filterwarnings = ["error::DeprecationWarning:apeiron.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N818",    # exceptions are named after the failure, not "Error"
    "N801",    # two deliberate trailing-underscore aliases avoid shadowing builtins
    "RUF001",  # full-width punctuation inside Chinese translations
    "RUF002",
    "RUF003",
    "SIM105",  # explicit try/except in logging and hot paths is intentional
    "SIM112",  # Windows environment variable names are documented in PascalCase
    "SIM113",
    "RUF034",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The QML bridge intentionally exposes camelCase slots and properties.
"src/apeiron/ui/backend.py" = ["N802", "N815"]
# The translation table is data: one long English key per line is clearer.
"tools/build_translations.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["apeiron"]
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false

# PySide6 exposes Qt properties and slots as descriptors, so static analysis of
# the QML bridge reports false positives for every attribute access.  The bridge
# is covered by the headless GUI smoke test instead.
[[tool.mypy.overrides]]
module = ["apeiron.ui.*", "apeiron.__main__"]
ignore_errors = true
