name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "csrc/**"
      - "packaging/**"
      - "tools/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  package:
    name: Nuitka package (${{ matrix.os }})
    # Building on the oldest still-supported hosted image gives the broadest
    # glibc compatibility for the Linux artifact.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: apeiron-linux-x86_64
          - os: macos-14
            artifact: apeiron-macos-arm64
          - os: windows-2022
            artifact: apeiron-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 patchelf
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials>=6.8,<6.10" "PySide6-Addons>=6.8,<6.10" \
            "nuitka>=2.4" "zstandard>=0.23" "ordered-set>=4.1" "setuptools>=68" wheel
      - name: Build and self-check the artifact
        run: python packaging/build_nuitka.py --output-dir dist
      - name: Smoke-run the packaged entry point
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/__main__.dist/Apeiron.exe"
          else
            BIN="dist/__main__.dist/Apeiron"
          fi
          test -x "$BIN" || { echo "missing artifact: $BIN"; ls -R dist | head -50; exit 1; }
          "$BIN" --version
          QT_QPA_PLATFORM=offscreen "$BIN" --self-check | tee self-check.out
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("self-check.out").read_text()
          payload = json.loads(raw[raw.index("{"):])
          assert payload["ok"], payload
          checks = payload["checks"]
          assert checks["nativeLogCore"]["loaded"], "native extension missing in artifact"
          assert checks["qml"]["loaded"], "QML failed to load in artifact"
          assert checks["database"]["integrity"], "database integrity check failed"
          print("artifact self-check ok")
          PY
        env:
          APEIRON_HOME: ${{ runner.temp }}/apeiron-artifact-home
      - name: Archive the distribution
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../out/${{ matrix.artifact }}.zip" __main__.dist >/dev/null)
          else
            (cd dist && tar -czf "../out/${{ matrix.artifact }}.tar.gz" __main__.dist)
          fi
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
