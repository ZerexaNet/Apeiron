name: Build

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    paths:
      - "src/**"
      - "csrc/**"
      - "packaging/**"
      - "tools/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      macos_arch:
        description: "macOS architecture (ARM64 runners may have capacity delays)"
        type: choice
        required: true
        default: x86_64
        options:
          - x86_64
          - arm64

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  package:
    name: Nuitka package (${{ matrix.os }})
    # Building on the oldest still-supported hosted image gives the broadest
    # glibc compatibility for the Linux artifact.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            artifact: apeiron-linux-x86_64
          # Keep routine builds off the capacity-constrained ARM64 pool.
          # Native Apple Silicon packages remain available via Run workflow.
          - os: ${{ inputs.macos_arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
            arch: ${{ inputs.macos_arch == 'arm64' && 'arm64' || 'x64' }}
            artifact: ${{ inputs.macos_arch == 'arm64' && 'apeiron-macos-arm64' || 'apeiron-macos-x86_64' }}
          - os: windows-2022
            arch: x64
            artifact: apeiron-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Verify interpreter architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY_ARCH'
          import os, platform
          expected = os.environ["EXPECTED_ARCH"]
          actual = platform.machine().lower()
          allowed = {"x64": {"x86_64", "amd64"}, "arm64": {"arm64", "aarch64"}}
          assert actual in allowed[expected], f"expected {expected}, got {actual}"
          print(f"interpreter architecture: {actual}")
          PY_ARCH
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 patchelf
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials>=6.8,<6.10" "PySide6-Addons>=6.8,<6.10" "nuitka>=2.4" "zstandard>=0.23" "ordered-set>=4.1" "setuptools>=68" wheel
      - name: Build and self-check the artifact
        run: python packaging/build_nuitka.py --output-dir dist
      - name: Smoke-run the packaged entry point
        shell: bash
        run: |
          # The standalone directory is named after the compiled entry script,
          # so locate the binary instead of hard-coding it.
          set -euo pipefail
          BIN=$(find dist -maxdepth 2 -type f -name "ApeironLauncher*" | head -1)
          test -n "$BIN" || { echo "no artifact produced"; ls -R dist | head -50; exit 1; }
          echo "artifact: $BIN"
          "$BIN" --version
          QT_QPA_PLATFORM=offscreen "$BIN" --self-check | tee self-check.out
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("self-check.out").read_text()
          payload = json.loads(raw[raw.index("{"):])
          assert payload["ok"], payload
          checks = payload["checks"]
          assert checks["nativeLogCore"]["loaded"], "native extension missing in artifact"
          assert checks["qml"]["loaded"], "QML failed to load in artifact"
          assert checks["database"]["integrity"], "database integrity check failed"
          print("artifact self-check ok")
          PY
        env:
          APEIRON_HOME: ${{ runner.temp }}/apeiron-artifact-home
      - name: Archive the distribution
        shell: bash
        run: |
          mkdir -p out
          DIST_DIR=$(find dist -maxdepth 1 -type d -name "*.dist" | head -1)
          test -n "$DIST_DIR" || { echo "no distribution directory"; exit 1; }
          NAME=$(basename "$DIST_DIR")
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../out/${{ matrix.artifact }}.zip" "$NAME" >/dev/null)
          else
            (cd dist && tar -czf "../out/${{ matrix.artifact }}.tar.gz" "$NAME")
          fi
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apeiron-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes
          fi
